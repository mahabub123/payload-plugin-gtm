name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Lets the release workflow run the same checks before publishing.
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Lint, typecheck and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Type-checks src/ and dev/ (including tests).
      - run: pnpm typecheck
      - run: pnpm build

  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      PAYLOAD_SECRET: ci-test-secret
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Unit, browser (jsdom) and integration tests (Payload on a temporary SQLite file).
      - run: pnpm test
